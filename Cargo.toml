[workspace]
members = [
    "crates/tinker-convex",
    "crates/tinker-transcript",
    "crates/tinker-workspace",
    "crates/tinker-agent",
    "crates/tinker-host",
    "crates/tinker-server",
    "crates/tinker-cli",
]
resolver = "3"

[workspace.package]
version = "0.4.3"
edition = "2024"
license = "FSL-1.1-ALv2"

[workspace.lints.rust]
unused = "deny"

[profile.release]
lto = true
strip = "symbols"
