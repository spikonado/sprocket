[workspace]
members = [
    "crates/sprocket-convex-provider",
    "crates/sprocket-workspace",
    "crates/sprocket-agent",
    "crates/sprocket-server",
    "crates/sprocket-cli",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"

[profile.release]
lto = true
strip = "symbols"
