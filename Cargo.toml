[workspace]
members = [
    "crates/sprocket-convex",
    "crates/sprocket-transcript",
    "crates/sprocket-workspace",
    "crates/sprocket-agent",
    "crates/sprocket-host",
    "crates/sprocket-server",
    "crates/sprocket-cli",
]
resolver = "3"

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "FSL-1.1-ALv2"

[workspace.lints.rust]
unused = "deny"

[workspace.dependencies]
anyhow = "1.0.102"
axum = "0.8.8"
base64 = "0.23.0"
clap = { version = "4.5.60", features = ["derive"] }
convex = { version = "0.10.4", default-features = false, features = ["rustls-tls-native-roots"] }
fs4 = { version = "1.1.0", default-features = false }
futures = "0.3.32"
gix = { version = "0.90", default-features = false, features = ["sha1", "max-performance"] }
hex = "0.4.3"
hmac = "0.13.0"
keyring = "4.2.0"
libc = "0.2.186"
open = "5.4.2"
posthog-rs = "0.30.0"
reqwest = { version = "0.13.4", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
sprocket-agent = { path = "crates/sprocket-agent" }
sprocket-convex = { path = "crates/sprocket-convex" }
sprocket-host = { path = "crates/sprocket-host" }
sprocket-server = { path = "crates/sprocket-server" }
sprocket-transcript = { path = "crates/sprocket-transcript" }
sprocket-workspace = { path = "crates/sprocket-workspace" }
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = "1.52.1"
tokio-tungstenite = "0.30.0"
tokio-util = "0.7.18"
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.21.0", features = ["v4"] }
windows-sys = "0.61"
workos = "3.4.1"

[profile.release]
lto = true
strip = "symbols"
