[workspace]
members = [
    "crates/sprocket-convex",
    "crates/sprocket-workspace",
    "crates/sprocket-agent",
    "crates/sprocket-server",
    "crates/sprocket-cli",
]
resolver = "3"

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "FSL-1.1-ALv2"

[workspace.lints.rust]
unused = "deny"

[profile.release]
lto = true
strip = "symbols"
