repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
        exclude: ^apps/web/src/demo/fixtures/rp2350-devboard/kicad/
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: check-xml
      - id: end-of-file-fixer
        exclude: ^apps/web/src/demo/fixtures/rp2350-devboard/kicad/
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        exclude: (^(bun\.lock|Cargo\.lock|crates/sprocket-kicad/src/text/newstroke\.txt)$|/_generated/|^apps/web/static/kicanvas/|^apps/web/src/demo/fixtures/rp2350-devboard/kicad/)
        exclude_types: [svg]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-github-actions
        args: ['--verbose']
      - id: check-github-workflows
        args: ['--verbose']
      - id: check-github-workflows-require-timeout

  - repo: local
    hooks:
      - id: no-source-text-rust-tests
        name: Test behavior, not repository source text
        language: pygrep
        entry: '\b(?:include_(?:str|bytes)!|(?:std::|tokio::)?fs::read_to_string)\s*\(\s*(?:r\#*)?"(?![^"\n]*\bfixtures?/)(?:[^"\n]*\.(?:rs|[cm]?[jt]sx?)|(?:[^"\n]*/)?SKILL\.md)"\#*\s*[,)]'
        args: [--multiline]
        files: (^|/)(tests?|test_support)(\.rs|/.*\.rs)$

      - id: no-copied-rust-test-schemas
        name: Test schema constraints, not copied whole schemas
        language: pygrep
        entry: '(?s)\bassert_eq!\s*\((?:(?!;|assert_eq!).)*?,\s*(?:serde_json::)?json!\s*\(\s*\{\s*"\$schema"\s*:\s*"https?://json-schema\.org/'
        args: [--multiline]
        files: (^|/)(tests?|test_support)(\.rs|/.*\.rs)$

      - id: sync-skills
        name: sync-skills
        language: system
        entry: node tools/sync-skills.mjs
        pass_filenames: false
        files: ^(tools/(sync-skills\.mjs|agent-(browser|desktop)/releases\.json)|crates/sprocket-workspace/skills/(agent-(browser|desktop)|frontend-design|modern-web-guidance|ui-sdk)/)

      - id: cargo-fmt
        name: cargo-fmt
        language: system
        entry: cargo fmt
        pass_filenames: false

      - id: nix-fmt
        name: nix-fmt
        language: system
        entry: nix fmt
        pass_filenames: false

      - id: commitlint
        name: commitlint
        language: system
        entry: commitlint --edit
        stages: [commit-msg]

      - id: oxlint
        name: oxlint
        language: system
        entry: bun run lint:oxlint
        pass_filenames: false

      - id: typescript-check
        name: typescript-check
        language: system
        entry: bun run check
        pass_filenames: false

      - id: bun-fmt
        name: bun-fmt
        language: system
        entry: bun fmt .
        pass_filenames: false

      - id: mermaid
        name: mermaid
        language: system
        entry: bun run lint:mermaid
        pass_filenames: false
