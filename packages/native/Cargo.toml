[package]
name = "sprocket-native"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.102"
napi = { version = "3.8.6", features = ["tokio_rt"] }
napi-derive = "3.5.5"
sprocket-workspace = { path = "../../crates/sprocket-workspace" }
sprocket-agent = { path = "../../crates/sprocket-agent" }

[build-dependencies]
napi-build = "2"
