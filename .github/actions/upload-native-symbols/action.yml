name: Upload native debug symbols
description: Strip the Rust CLI's binary and upload its debug symbols to PostHog.

inputs:
  binary:
    description: Path to the unstripped sprocket executable.
    required: true
  api-key:
    description: PostHog personal API key.
    required: true
  project-id:
    description: PostHog project ID.
    required: true

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
    - name: Split debug symbols
      shell: bash
      env:
        BINARY: ${{ inputs.binary }}
      run: |
        mkdir -p .native-symbols
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          # Cargo uplifts the dSYM as a symlink into deps/.
          cp -RL "$BINARY.dSYM" .native-symbols/
          strip "$BINARY"
        else
          # GNU binutils can't read the cross-compiled arm64 binary.
          rustup component add llvm-tools
          llvm_bin="$(rustc --print sysroot)/lib/rustlib/$(rustc --print host-tuple)/bin"
          # Leaving the code out keeps a dev build's symbols under posthog-cli's 100 MB limit.
          "$llvm_bin/llvm-objcopy" --only-keep-debug "$BINARY" .native-symbols/sprocket.debug
          "$llvm_bin/llvm-strip" "$BINARY"
        fi
    - name: Upload debug symbols
      shell: bash
      env:
        POSTHOG_CLI_HOST: https://eu.posthog.com
        POSTHOG_CLI_API_KEY: ${{ inputs.api-key }}
        POSTHOG_CLI_PROJECT_ID: ${{ inputs.project-id }}
      run: |
        bunx posthog-cli symbol-sets upload --directory .native-symbols 2>&1 | tee "$RUNNER_TEMP/symbol-upload.log"
        # posthog-cli skips oversized symbol sets but still exits 0.
        grep -q ' 0 too large)' "$RUNNER_TEMP/symbol-upload.log"
