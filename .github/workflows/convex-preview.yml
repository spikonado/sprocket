name: Convex Preview

on: pull_request

permissions:
  contents: read

concurrency:
  group: convex-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.0
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: cachix/cachix-action@v17
        with:
          name: spikonado
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build and Cache Shell Environment
        run: |
          nix develop --profile sprocket-shell -c true
          cachix push spikonado sprocket-shell

      - name: Install dependencies
        shell: 'nix develop --profile sprocket-shell -c bash -e {0}'
        run: bun install --frozen-lockfile

      - name: Validate preview deploy key
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
        run: |
          if [[ -z "$CONVEX_DEPLOY_KEY" ]]; then
            echo "::error::Add a Convex project preview deploy key as the CONVEX_PREVIEW_DEPLOY_KEY repository or organization secret."
            exit 1
          fi

      - name: Deploy Convex preview
        working-directory: apps/web
        shell: 'nix develop --profile ../../sprocket-shell -c bash -e {0}'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: |
          nix develop -c bunx convex deploy --preview-name "$CONVEX_PREVIEW_NAME"
