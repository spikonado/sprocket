name: Suggest connectors

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: suggest-connectors
  cancel-in-progress: false

jobs:
  suggest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH_NAME: bot/suggest-connectors
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Find suggestions
        run: bun tools/connectors/suggest-connectors.ts

      - name: Create or update pull request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          path=tools/connectors/candidates.json
          if [[ -z "$(git status --porcelain -- "$path")" ]]; then
            echo "Connector suggestions are already current."
            exit 0
          fi

          title="chore(connectors): Update MCP connector suggestions"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          git add -- "$path"
          git commit -m "$title"
          git fetch origin "$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME" || true
          git push --force-with-lease --set-upstream origin "$BRANCH_NAME"

          body="$(cat <<'EOF'
          Automated weekly update generated by `bun tools/connectors/suggest-connectors.ts`.

          These servers in the official MCP Registry aren't in the connector list. Add approved ones
          to `crates/sprocket-host/connector-catalog.json` and rejected ids to
          `tools/connectors/excluded.json`.

          ### Suggestions
          EOF
          )"
          candidates="$(jq -r '.[] | "- `\(.id)` · `\(.registryName)` · \(.url)"' "$path")"
          body="$(printf '%s\n\n%s\n' "$body" "${candidates:-No new suggestions.}")"
          pr_number="$(
            gh pr list \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH_NAME" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH_NAME" \
              --title "$title" \
              --body "$body"
          else
            gh pr edit "$pr_number" --title "$title" --body "$body"
          fi
