name: Update KiCad

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-kicad
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: bot/update-kicad
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: nixbuild/nix-quick-install-action@v35

      - name: Mirror and pin the newest KiCad nightly
        run: >-
          nix shell --inputs-from .
          nixpkgs#bun nixpkgs#uv nixpkgs#minisign nixpkgs#osslsigncode nixpkgs#rcodesign nixpkgs#dwarfs
          -c bun tools/kicad/update-release.mjs

      - name: Create or update pull request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          paths=(tools/kicad/releases.json tools/kicad/requirements.txt)

          if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
            echo "KiCad is already current."
            exit 0
          fi

          version="$(jq -r .version tools/kicad/releases.json)"
          title="chore(tools): Update KiCad to $version"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          git add -- "${paths[@]}"
          git commit -m "$title"

          git fetch origin "$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME" || true
          git push --force-with-lease --set-upstream origin "$BRANCH_NAME"

          body="Automated weekly update generated by \`tools/kicad/update-release.mjs\`. It mirrors [kicad-$version]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/kicad-$version) and passed the headless kipy smoke test on Linux. Install it through Settings → Connectors on macOS and Windows before merging."
          pr_number="$(
            gh pr list \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH_NAME" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH_NAME" \
              --title "$title" \
              --body "$body"
          else
            gh pr edit "$pr_number" --title "$title" --body "$body"
          fi
