name: Update Convex AI Files

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-convex-ai-files
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: bot/update-convex-ai-files
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update Convex AI files
        working-directory: apps/web
        run: |
          bunx convex ai-files update
          bunx prettier --write AGENTS.md CLAUDE.md skills-lock.json .agents/skills

      - name: Create pull request and enable auto-merge
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Convex AI files are already current."
            exit 0
          fi

          while IFS= read -r path; do
            case "$path" in
              apps/web/AGENTS.md | \
              apps/web/CLAUDE.md | \
              apps/web/skills-lock.json | \
              apps/web/.agents/skills/* | \
              apps/web/src/convex/_generated/ai/*) ;;
              *)
                echo "::error::Convex AI file update changed unexpected path: $path"
                exit 1
                ;;
            esac
          done < <(git status --porcelain | cut -c4-)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          git add \
            apps/web/AGENTS.md \
            apps/web/CLAUDE.md \
            apps/web/skills-lock.json \
            apps/web/.agents/skills \
            apps/web/src/convex/_generated/ai
          git commit -m "chore(convex): Update Convex AI files"

          git fetch origin "$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME" || true
          git push --force-with-lease --set-upstream origin "$BRANCH_NAME"

          pr_number="$(
            gh pr list \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH_NAME" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -z "$pr_number" ]]; then
            pr_url="$(gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH_NAME" \
              --title "chore(convex): Update Convex AI files" \
              --body "Automated weekly update generated by \`bunx convex ai-files update\`.")"
            pr_number="${pr_url##*/}"
          fi

          gh pr merge "$pr_number" --auto --squash
