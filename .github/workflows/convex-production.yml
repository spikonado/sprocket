name: Convex Production

on:
  workflow_run:
    workflows: [Build and Test]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # Builds that won't deploy get their own group so they can't replace a pending deploy.
  group: convex-production-${{ github.event.workflow_run.conclusion == 'success' && 'deploy' || github.run_id }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-nix-shell
        with:
          dev-shell: '.#convex'

      - name: Install dependencies
        shell: 'nix develop ./sprocket-shell -c bash -e {0}'
        run: bun install --frozen-lockfile

      - name: Validate secrets
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PRODUCTION_DEPLOY_KEY }}
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_SITE_DEPLOY_HOOK_URL }}
        run: |
          if [[ -z "$CONVEX_DEPLOY_KEY" ]]; then
            echo "::error::Add a Convex production deployment deploy key as the CONVEX_PRODUCTION_DEPLOY_KEY repository or organization secret."
            exit 1
          fi
          if [[ -z "$DEPLOY_HOOK_URL" ]]; then
            echo "::error::Add the usesprocket.dev Vercel deploy hook URL as the VERCEL_SITE_DEPLOY_HOOK_URL repository secret."
            exit 1
          fi

      # Vercel doesn't build main on push, and the hook builds main's tip, so it only fires while
      # that tip is the commit just deployed. A newer commit's own run fires it after its deploy.
      - name: Deploy Convex production and rebuild usesprocket.dev
        working-directory: apps/web
        shell: 'nix develop ../../sprocket-shell -c bash -e {0}'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PRODUCTION_DEPLOY_KEY }}
          CONVEX_DEPLOY_MESSAGE: Production deploy for ${{ github.event.workflow_run.head_sha }}
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_SITE_DEPLOY_HOOK_URL }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tested_is_main() {
            git fetch --quiet origin main
            [[ "$TESTED_SHA" == "$(git rev-parse origin/main)" ]]
          }

          if ! tested_is_main; then
            echo "Skipping stale production deploy for $TESTED_SHA."
            exit 0
          fi

          bunx convex deploy --message "$CONVEX_DEPLOY_MESSAGE"
          bunx convex run migrations:run

          if ! tested_is_main; then
            echo "main moved during the deploy, so its own run rebuilds usesprocket.dev."
            exit 0
          fi
          curl --fail-with-body --silent --show-error -X POST "$DEPLOY_HOOK_URL"
