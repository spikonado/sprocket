name: Update pinned tools

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: bun
            label: Bun
          - tool: agent-browser
            label: agent-browser
            note: ' Check the dashboard adapters in `crates/sprocket-server/src/routes/browser.rs` against the new release before merging: dashboard loading, dynamic chunks, session creation, and live input.'
          - tool: agent-desktop
            label: agent-desktop
    concurrency:
      group: update-${{ matrix.tool }}
      cancel-in-progress: false
    env:
      TOOL: ${{ matrix.tool }}
      LABEL: ${{ matrix.label }}
      NOTE: ${{ matrix.note }}
      BRANCH_NAME: bot/update-${{ matrix.tool }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2

      - name: Pin the latest release
        run: |
          bun "tools/$TOOL/update-release.mjs"
          bun tools/sync-skills.mjs

      - name: Create or update pull request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          paths=("tools/$TOOL/releases.json")
          if [[ -d "crates/sprocket-workspace/skills/$TOOL" ]]; then
            paths+=("crates/sprocket-workspace/skills/$TOOL/SKILL.md")
          fi

          if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
            echo "$LABEL is already current."
            exit 0
          fi

          version="$(jq -r .version "tools/$TOOL/releases.json")"
          title="chore(tools): Update $LABEL to $version"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          git add -- "${paths[@]}"
          git commit -m "$title"

          git fetch origin "$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME" || true
          git push --force-with-lease --set-upstream origin "$BRANCH_NAME"

          body="Automated weekly update generated by the scripts in \`tools/$TOOL\`.$NOTE"
          pr_number="$(
            gh pr list \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH_NAME" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH_NAME" \
              --title "$title" \
              --body "$body"
          else
            gh pr edit "$pr_number" --title "$title" --body "$body"
          fi
