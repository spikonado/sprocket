name: Build and Test

on:
  merge_group:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native_credential_store_check:
    name: Native credential store (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-credential-store-${{ matrix.os }}
      - name: Check native server
        run: cargo check --locked -p sprocket-server

  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-nix-shell

      - uses: Swatinem/rust-cache@v2
        with:
          cmd-format: nix develop ./sprocket-shell -c {0}
          # Cached build scripts embed Nix interpreter paths from flake.lock.
          prefix-key: v0-rust-${{ hashFiles('flake.lock') }}

      - name: Bun install
        shell: 'nix develop ./sprocket-shell -c bash -e {0}'
        run: bun install --frozen-lockfile

      - name: Bun build
        shell: 'nix develop ./sprocket-shell -c bash -e {0}'
        run: bun run build

      - name: Bun test
        shell: 'nix develop ./sprocket-shell -c bash -e {0}'
        run: bun run test

      - name: Cargo test
        shell: 'nix develop ./sprocket-shell -c bash -e {0}'
        run: cargo test
