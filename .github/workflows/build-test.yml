name: Build and Test

on:
  merge_group:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native_tests:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux runs the full suite in the rust job.
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check native server
        run: cargo check --locked -p sprocket-server
      - name: Test native credential storage
        run: cargo test --locked -p sprocket-host native_auth::credentials::tests
      - name: Test workspace patch replacement
        run: cargo test --locked -p sprocket-workspace patch::tests
      - name: Test workspace command shells
        run: cargo test --locked -p sprocket-workspace command_shell
      - name: Test failed command launch cleanup
        run: cargo test --locked -p sprocket-workspace commands::tests::failed_process_launch

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-nix-shell

      - name: Bun install
        shell: 'nix develop ./sprocket-shell -c bash -e {0}'
        run: bun install --frozen-lockfile

      - name: Build web
        shell: 'nix develop ./sprocket-shell -c bash -e {0}'
        run: bun run --cwd apps/web build

      - name: Bun test
        shell: 'nix develop ./sprocket-shell -c bash -e {0}'
        run: bun run test

  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-nix-shell

      - uses: Swatinem/rust-cache@v2
        with:
          cmd-format: nix develop ./sprocket-shell -c {0}
          # Cached build scripts embed Nix interpreter paths from flake.lock.
          prefix-key: v0-rust-${{ hashFiles('flake.lock') }}

      - name: Cargo test
        shell: 'nix develop ./sprocket-shell -c bash -e {0}'
        run: cargo test --locked
