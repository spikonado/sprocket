name: Build and Test

on:
  merge_group:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required checks pass when skipped, so PRs skip suites their files can't affect.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ci: &ci
              - .github/actions/**
              - .github/workflows/build-test.yml
              - flake.nix
              - flake.lock
            rust:
              - *ci
              - crates/**
              - Cargo.toml
              - Cargo.lock
              - tools/agent-browser/*.json
              - tools/agent-desktop/*.json
              - tools/bun/*.json
              - tools/kicad/{releases.json,requirements.txt}
              - tools/uv/*.json
            web:
              - *ci
              - apps/**
              - npm/**
              - packages/**
              - scripts/**
              - tools/**
              - bun.lock
              - bunfig.toml
              - oxlint.config.ts
              - package.json
              - turbo.json
              # The npm package build copies these.
              - deleted: '{LICENSE,README,THIRD_PARTY_NOTICES}.md'

  native_tests:
    name: Native (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Linux runs the full suite in the rust job.
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check native server
        run: cargo check --locked -p sprocket-server
      - name: Test native credential storage
        run: cargo test --locked -p sprocket-host native_auth::credentials::tests
      - name: Test private file permissions
        run: cargo test --locked -p sprocket-host profile::tests
      - name: Test workspace patch replacement
        run: cargo test --locked -p sprocket-workspace patch::tests
      - name: Test workspace command shells
        run: cargo test --locked -p sprocket-workspace command_shell
      - name: Test failed command launch cleanup
        run: cargo test --locked -p sprocket-workspace commands::tests::failed_process_launch
      - name: Test pinned tool installs
        run: cargo test --locked -p sprocket-host -- tool_install::tests python_install::tests

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-nix-shell

      - name: Bun install
        shell: 'nix develop ./sprocket-shell -c bash -e {0}'
        run: bun install --frozen-lockfile

      - name: Build web
        shell: 'nix develop ./sprocket-shell -c bash -e {0}'
        run: bun run --cwd apps/web build

      - name: Bun test
        shell: 'nix develop ./sprocket-shell -c bash -e {0}'
        run: bun run test

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-nix-shell

      - uses: Swatinem/rust-cache@v2
        with:
          cmd-format: nix develop ./sprocket-shell -c {0}
          # Cached build scripts embed Nix interpreter paths from flake.lock.
          prefix-key: v0-rust-${{ hashFiles('flake.lock') }}

      - name: Cargo test
        shell: 'nix develop ./sprocket-shell -c bash -e {0}'
        run: cargo test --locked
