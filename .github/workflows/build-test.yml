name: Build and Test

on:
  merge_group:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: cachix/install-nix-action@v31.10.6
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: cachix/cachix-action@v17
        with:
          name: spikonado
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build and Cache Shell Environment
        run: |
          nix develop --profile sprocket-shell -c true
          cachix push spikonado sprocket-shell

      - name: Bun install
        shell: 'nix develop --profile sprocket-shell -c bash -e {0}'
        run: bun install --frozen-lockfile

      - name: Bun build
        shell: 'nix develop --profile sprocket-shell -c bash -e {0}'
        run: bun run build

      - name: Bun test
        shell: 'nix develop --profile sprocket-shell -c bash -e {0}'
        run: bun run test

      - name: Cargo test
        shell: 'nix develop --profile sprocket-shell -c bash -e {0}'
        run: cargo test
