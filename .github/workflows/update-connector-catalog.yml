name: Update connector catalog

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-connector-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH_NAME: bot/update-connector-catalog
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Update catalog and candidates
        run: bun tools/connectors/update-catalog.ts

      - name: Create or update pull request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          paths=(crates/sprocket-host/connector-catalog.json tools/connectors/candidates.json)
          if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
            echo "Connector catalog and candidates are already current."
            exit 0
          fi

          title="chore(connectors): Update MCP connector catalog"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          git add -- "${paths[@]}"
          git commit -m "$title"
          git fetch origin "$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME" || true
          git push --force-with-lease --set-upstream origin "$BRANCH_NAME"

          body="$(cat <<'EOF'
          Automated weekly update generated by `bun tools/connectors/update-catalog.ts`.

          These candidates qualify in the official registry but aren't in the catalog. Add approved
          ones to `tools/connectors/vendors.json` and rejected ids to `tools/connectors/excluded.json`.

          ### Discovery candidates
          EOF
          )"
          candidates="$(jq -r '.[] | "- `\(.id)` · `\(.registryName)` · \(.url)"' tools/connectors/candidates.json)"
          body="$(printf '%s\n\n%s\n' "$body" "${candidates:-No new qualifying candidates.}")"
          pr_number="$(
            gh pr list \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH_NAME" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH_NAME" \
              --title "$title" \
              --body "$body"
          else
            gh pr edit "$pr_number" --title "$title" --body "$body"
          fi
