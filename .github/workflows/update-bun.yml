name: Update Bun

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-bun
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: bot/update-bun
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2

      - name: Pin the latest Bun
        run: bun tools/bun/update-release.mjs

      - name: Create or update pull request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Bun is already current."
            exit 0
          fi

          version="$(jq -r .bun.version tools/bun/releases.json)"
          title="chore(tools): Update Bun to $version"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          git add tools/bun/releases.json
          git commit -m "$title"

          git fetch origin "$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME" || true
          git push --force-with-lease --set-upstream origin "$BRANCH_NAME"

          body="Automated weekly update generated by \`tools/bun/update-release.mjs\`."
          pr_number="$(
            gh pr list \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH_NAME" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH_NAME" \
              --title "$title" \
              --body "$body"
          else
            gh pr edit "$pr_number" --title "$title" --body "$body"
          fi
