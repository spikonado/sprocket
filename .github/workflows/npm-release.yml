name: npm Release

on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: [Build and Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Semver version to build
        required: true
        type: string
      publish:
        description: Publish packages to npm
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Events that won't release get their own group so they can't replace a pending release.
  # Dev releases never cancel a running publish; GitHub keeps only the newest pending one, so they publish in order.
  group: >-
    npm-release-${{
      github.event_name != 'workflow_run' && github.ref ||
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && 'main-dev' ||
      github.run_id
    }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.value }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}
      source-sha: ${{ steps.version.outputs.source-sha }}
      release: ${{ steps.order.outputs.release }}
    steps:
      - name: Require default branch for manual dispatch
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          echo "::error::Manual npm releases must be dispatched from the default branch so release builds only run trusted, main-reachable code."
          exit 1
      - id: version
        name: Resolve version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            source_sha="$TESTED_SHA"
            version="0.4.3-dev.$source_sha"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            source_sha="$GITHUB_SHA"
            version="${GITHUB_REF_NAME#v}"
          else
            source_sha="$GITHUB_SHA"
            version="$DISPATCH_VERSION"
          fi
          stable_pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          canary_pattern='^[0-9]+\.[0-9]+\.[0-9]+-canary\.[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*$'
          dev_pattern='^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9a-f]{40}$'
          if [[ ! "$version" =~ $stable_pattern && ! "$version" =~ $canary_pattern && ! "$version" =~ $dev_pattern ]]; then
            echo "::error::Invalid release version: $version"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "source-sha=$source_sha" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ $dev_pattern ]]; then
            echo "npm-tag=dev" >> "$GITHUB_OUTPUT"
          elif [[ "$version" == *-canary.* ]]; then
            echo "npm-tag=canary" >> "$GITHUB_OUTPUT"
          else
            echo "npm-tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - id: order
        name: Skip dev builds older than the published dev release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_TAG: ${{ steps.version.outputs.npm-tag }}
          SOURCE_SHA: ${{ steps.version.outputs.source-sha }}
        run: |
          # Reruns of older main builds would otherwise move the dev tag back.
          release=true
          if [[ "$NPM_TAG" == "dev" ]]; then
            published="$(npm view usesprocket@dev version 2>/dev/null || true)"
            published_sha="${published##*-dev.}"
            if [[ "$published_sha" =~ ^[0-9a-f]{40}$ ]]; then
              status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$published_sha...$SOURCE_SHA" --jq .status)"
              # Identical builds still run so a rerun can finish a partial publish.
              if [[ "$status" == "behind" ]]; then
                echo "Skipping $SOURCE_SHA because the dev release $published is newer."
                release=false
              fi
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  web:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/web build
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          SPROCKET_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: apps/web/dist
          if-no-files-found: error

  native:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64-gnu
            runner: ubuntu-latest
            executable: sprocket
            rust-target: x86_64-unknown-linux-gnu
            glibc-version: '2.17'
          - id: linux-arm64-gnu
            runner: ubuntu-latest
            executable: sprocket
            rust-target: aarch64-unknown-linux-gnu
            glibc-version: '2.17'
          - id: darwin-x64
            runner: macos-15-intel
            executable: sprocket
          - id: darwin-arm64
            runner: macos-15
            executable: sprocket
          - id: win32-x64-msvc
            runner: windows-2022
            executable: sprocket.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # Dev builds publish on every main push, and LTO triples their build time.
      CARGO_PROFILE_RELEASE_LTO: ${{ needs.prepare.outputs.npm-tag == 'dev' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        if: matrix.glibc-version
      - uses: taiki-e/install-action@cargo-zigbuild
        if: matrix.glibc-version
      - name: Build native CLI for Linux
        if: matrix.glibc-version
        shell: bash
        env:
          SPROCKET_VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          cargo zigbuild --locked --release -p sprocket-cli
          --target "${{ matrix.rust-target }}.${{ matrix.glibc-version }}"
      - name: Build native CLI
        if: ${{ !matrix.glibc-version }}
        shell: bash
        env:
          SPROCKET_VERSION: ${{ needs.prepare.outputs.version }}
        run: cargo build --locked --release -p sprocket-cli
      - name: Stage native CLI
        shell: bash
        run: |
          mkdir -p artifact
          if [[ -n "${{ matrix.rust-target }}" ]]; then
            cp "target/${{ matrix.rust-target }}/release/${{ matrix.executable }}" artifact/
          else
            cp "target/release/${{ matrix.executable }}" artifact/
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.id }}
          path: artifact/${{ matrix.executable }}
          if-no-files-found: error

  package:
    needs: [prepare, web, native]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          path: release-artifacts
      - name: Restore web build
        run: |
          mkdir -p apps/web/dist
          cp -R release-artifacts/web/. apps/web/dist/
      - name: Assemble npm packages
        run: >-
          node scripts/build-npm-packages.mjs
          --version "${{ needs.prepare.outputs.version }}"
          --artifacts release-artifacts
          --web apps/web/dist
          --output npm-dist
      - name: Validate package contents
        run: |
          for package in npm-dist/*; do
            (
              cd "$package"
              npm pack --dry-run
            )
          done
          binaries="$(find npm-dist -type f \( -name sprocket -o -name sprocket.js \))"
          test -n "$binaries"
          while IFS= read -r binary; do
            test -x "$binary"
          done <<< "$binaries"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages-${{ needs.prepare.outputs.version }}
          path: npm-dist
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_run' || inputs.publish
    needs: [prepare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages-${{ needs.prepare.outputs.version }}
          path: npm-dist
      - name: Restore executable bits after artifact download
        run: >
          find npm-dist -type f \( -name sprocket -o -name sprocket.js \)
          -exec chmod 755 {} +
      - name: Publish native packages
        env:
          NPM_TAG: ${{ needs.prepare.outputs.npm-tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for package in npm-dist/*-*; do
            name="$(node -p "require('./$package/package.json').name")"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published; skipping"
            else
              (
                cd "$package"
                npm publish --tag "$NPM_TAG"
              )
            fi
          done
      - name: Wait for native packages on the registry
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Installs that resolve the root before its native packages keep the old binary.
          for package in npm-dist/*-*; do
            name="$(node -p "require('./$package/package.json').name")"
            for attempt in $(seq 60); do
              if npm view "$name@$VERSION" version >/dev/null 2>&1; then
                continue 2
              fi
              sleep 15
            done
            echo "::error::$name@$VERSION is not on the registry after 15 minutes."
            exit 1
          done
      - name: Publish root packages last
        env:
          NPM_TAG: ${{ needs.prepare.outputs.npm-tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # The legacy package goes last because its installs migrate to the usesprocket version.
          for package in npm-dist/sprocket npm-dist/legacy; do
            name="$(node -p "require('./$package/package.json').name")"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published; skipping"
            else
              (
                cd "$package"
                npm publish --tag "$NPM_TAG"
              )
            fi
          done
