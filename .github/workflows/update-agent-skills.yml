name: Update agent skills

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-agent-skills
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: bot/update-agent-skills
      GH_TOKEN: ${{ github.token }}
      DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The CLI writes unformatted files, so formatting keeps no-op runs from producing a diff.
      - name: Update skills in skills-lock.json
        run: |
          npx -y skills update -p -y
          bun fmt skills-lock.json .agents/skills

      - name: Create or update pull request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Agent skills are already current."
            exit 0
          fi

          while IFS= read -r path; do
            case "$path" in
              skills-lock.json | .agents/skills/*) ;;
              *)
                echo "::error::Skills update changed unexpected path: $path"
                exit 1
                ;;
            esac
          done < <(git status --porcelain | cut -c4-)

          title="chore(agents): Update agent skills"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          git add skills-lock.json .agents/skills
          git commit -m "$title"

          git fetch origin "$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME" || true
          git push --force-with-lease --set-upstream origin "$BRANCH_NAME"

          body="Automated weekly update generated by \`npx skills update -p\`. These skills run with full agent permissions, so read the instruction changes before merging."
          pr_number="$(
            gh pr list \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH_NAME" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH_NAME" \
              --title "$title" \
              --body "$body"
          fi
