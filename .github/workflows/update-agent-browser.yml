name: Update agent-browser

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-agent-browser
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: bot/update-agent-browser
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update agent-browser pin and skill
        run: |
          bun tools/agent-browser/update-release.mjs
          bun tools/agent-browser/sync-skill.mjs
          bunx prettier --write tools/agent-browser/releases.json THIRD_PARTY_NOTICES.md

      - name: Create or update pull request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "agent-browser is already current."
            exit 0
          fi

          while IFS= read -r path; do
            case "$path" in
              tools/agent-browser/releases.json | \
              crates/sprocket-workspace/skills/agent-browser/SKILL.md | \
              THIRD_PARTY_NOTICES.md) ;;
              *)
                echo "::error::agent-browser update changed unexpected path: $path"
                exit 1
                ;;
            esac
          done < <(git status --porcelain | cut -c4-)

          version="$(jq -r .agentBrowser.version tools/agent-browser/releases.json)"
          title="chore(tools): Update agent-browser to $version"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          git add \
            tools/agent-browser/releases.json \
            crates/sprocket-workspace/skills/agent-browser/SKILL.md \
            THIRD_PARTY_NOTICES.md
          git commit -m "$title"

          git fetch origin "$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME" || true
          git push --force-with-lease --set-upstream origin "$BRANCH_NAME"

          body="Automated weekly update generated by \`tools/agent-browser/update-release.mjs\` and \`tools/agent-browser/sync-skill.mjs\`. Check the dashboard adapters in \`crates/sprocket-server/src/routes/browser.rs\` against the new release before merging: dashboard loading, dynamic chunks, session creation, and live input."
          pr_number="$(
            gh pr list \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH_NAME" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH_NAME" \
              --title "$title" \
              --body "$body"
          else
            gh pr edit "$pr_number" --title "$title" --body "$body"
          fi
