<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>RP2350 dev board</title>
		<style>
			:root {
				color-scheme: light dark;
				font:
					14px/1.5 system-ui,
					sans-serif;
				--line: #2563eb;
				--muted: #6b7280;
			}
			body {
				margin: 0 auto;
				max-width: 880px;
				padding: 32px 24px;
			}
			header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 16px;
			}
			h1 {
				margin: 0;
				font-size: 20px;
			}
			button {
				font: inherit;
				padding: 8px 16px;
				border: 0;
				border-radius: 8px;
				background: var(--line);
				color: white;
				cursor: pointer;
			}
			.stats {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 12px;
				margin: 24px 0;
			}
			.stat {
				padding: 12px 16px;
				border: 1px solid #8884;
				border-radius: 12px;
			}
			.stat span {
				color: var(--muted);
				font-size: 12px;
			}
			.stat strong {
				display: block;
				font-size: 24px;
				font-variant-numeric: tabular-nums;
			}
			canvas {
				width: 100%;
				height: 280px;
				border: 1px solid #8884;
				border-radius: 12px;
			}
			#status {
				color: var(--muted);
			}
		</style>
	</head>
	<body>
		<header>
			<div>
				<h1>RP2350 dev board</h1>
				<div id="status">Not connected</div>
			</div>
			<button id="connect">Connect over USB</button>
		</header>
		<section class="stats">
			<div class="stat"><span>Battery</span><strong id="vbat">–</strong></div>
			<div class="stat"><span>USB power</span><strong id="usb">–</strong></div>
			<div class="stat"><span>Uptime</span><strong id="uptime">–</strong></div>
		</section>
		<canvas id="chart"></canvas>
		<script type="module">
			import { readLines } from './serial.js';
			import { mockPort } from './mock-port.js';

			const WINDOW_MS = 600_000;
			const GRID_MV = 50;
			const LOW_MV = 3300;
			const samples = [];
			const $ = (id) => document.getElementById(id);

			function draw() {
				const canvas = $('chart');
				const ratio = devicePixelRatio;
				canvas.width = canvas.clientWidth * ratio;
				canvas.height = canvas.clientHeight * ratio;
				const context = canvas.getContext('2d');
				context.scale(ratio, ratio);
				const width = canvas.clientWidth;
				const height = canvas.clientHeight;
				const volts = samples.map((sample) => sample.vbat_mv);
				const low = Math.floor(Math.min(...volts) / GRID_MV) * GRID_MV - GRID_MV;
				const high = Math.ceil(Math.max(...volts) / GRID_MV) * GRID_MV + GRID_MV;
				const x = (ms) => width - ((samples.at(-1).ms - ms) / WINDOW_MS) * width;
				const y = (mv) => height - ((mv - low) / (high - low)) * height;

				context.strokeStyle = '#8884';
				context.fillStyle = getComputedStyle(document.body).color;
				context.font = '11px system-ui';

				for (let mv = low + GRID_MV; mv < high; mv += GRID_MV) {
					context.beginPath();
					context.moveTo(0, y(mv));
					context.lineTo(width, y(mv));
					context.stroke();
					context.fillText(`${(mv / 1000).toFixed(2)} V`, 8, y(mv) - 4);
				}

				context.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--line');
				context.lineWidth = 2;
				context.beginPath();
				samples.forEach((sample, index) =>
					context[index ? 'lineTo' : 'moveTo'](x(sample.ms), y(sample.vbat_mv))
				);
				context.stroke();
			}

			function show(sample) {
				samples.push(sample);
				while (samples[0].ms < sample.ms - WINDOW_MS) samples.shift();
				$('vbat').textContent = `${(sample.vbat_mv / 1000).toFixed(2)} V`;
				$('vbat').style.color = sample.vbat_mv < LOW_MV ? '#dc2626' : '';
				$('usb').textContent = sample.usb ? 'Plugged in' : 'Battery';
				$('uptime').textContent = `${Math.floor(sample.ms / 1000)} s`;
				draw();
			}

			async function connect() {
				const port = location.search.includes('mock')
					? mockPort()
					: await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x2e8a }] });
				await port.open({ baudRate: 115200 });
				$('status').textContent = 'Connected';

				for await (const line of readLines(port)) {
					if (line.startsWith('{')) show(JSON.parse(line));
				}

				$('status').textContent = 'Disconnected';
			}

			if (!('serial' in navigator) && !location.search.includes('mock')) {
				$('status').textContent = 'Web Serial needs Chrome or Edge on desktop.';
				$('connect').disabled = true;
			}

			$('connect').addEventListener('click', () =>
				connect().catch((error) => ($('status').textContent = error.message))
			);
		</script>
	</body>
</html>
