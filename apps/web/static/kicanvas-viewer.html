<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				background: var(--background);
			}
		</style>
		<style id="sprocket-theme"></style>
	</head>
	<body>
		<!-- In the body, since the bundle appends its font stylesheet to `document.body`. -->
		<script src="/kicanvas/kicanvas.js"></script>
		<script>
			const reply = (message) => parent.postMessage(message, '*');
			let embed = null;
			let firstDraw = null;

			const appFor = (page) =>
				embed.shadowRoot.querySelector(page.type === 'pcb' ? 'kc-board-app' : 'kc-schematic-app');
			const project = () =>
				embed?.shadowRoot?.querySelector('kc-schematic-app, kc-board-app')?.project;

			function currentView() {
				const page = project()?.active_page;

				if (!page) return null;

				const { center, zoom } = appFor(page).viewer.viewport.camera;

				return { page: page.project_path, x: center.x, y: center.y, zoom };
			}

			async function drawn(page, open) {
				const app = appFor(page);
				await app.viewerReady;
				const { viewer } = app;
				const loaded = new Promise((resolve) => {
					const onLoad = () => {
						if (viewer.document !== page.document) return;
						viewer.removeEventListener('kicanvas:load', onLoad);
						resolve();
					};
					viewer.addEventListener('kicanvas:load', onLoad);
				});

				open?.();
				await loaded;

				return viewer;
			}

			// Reopens the user's page, then restores their camera after KiCanvas fits the page.
			async function show(view) {
				const pages = project();
				const page = view && pages.page_by_path(view.page);
				const viewer =
					page && page !== pages.active_page
						? await drawn(page, () => pages.set_active_page(page))
						: await firstDraw;

				if (!page) return;

				viewer.viewport.camera.center.set(view.x, view.y);
				viewer.viewport.camera.zoom = view.zoom;
				viewer.draw();
			}

			function load(sources) {
				embed = document.createElement('kicanvas-embed');
				embed.setAttribute('controls', 'full');
				// KiCanvas's focus overlay swallows the first click, which only helps embeds on scrolling pages.
				embed.setAttribute('controlslist', 'nooverlay');
				embed.style.cssText = 'width: 100%; height: 100%;';

				for (const { name, content } of sources) {
					const element = document.createElement('kicanvas-source');
					element.setAttribute('name', name);
					element.textContent = content;
					embed.append(element);
				}

				// KiCanvas reports how its load ended only through these attributes.
				const observer = new MutationObserver(() => {
					if (embed.hasAttribute('loading')) return;
					observer.disconnect();

					if (!embed.hasAttribute('loaded')) return reply({ type: 'failed' });
					firstDraw = drawn(project().active_page);
					reply({ type: 'parsed' });
				});
				observer.observe(embed, { attributeFilter: ['loading', 'loaded'] });
				document.body.append(embed);
			}

			// Such as KiCanvas's renderer setup throwing when the browser has no WebGL2.
			addEventListener('unhandledrejection', ({ reason }) =>
				reply({ type: 'failed', error: reason instanceof Error ? reason.message : undefined })
			);

			addEventListener('message', ({ source, data }) => {
				if (source !== parent) return;

				if (data?.type === 'theme')
					document.getElementById('sprocket-theme').textContent = data.css;

				if (data?.type === 'sources') load(data.sources);

				if (data?.type === 'show') {
					show(data.view).then(
						() => reply({ type: 'loaded' }),
						() => reply({ type: 'failed' })
					);
				}

				if (data?.type === 'getView') reply({ type: 'view', view: currentView() });
			});

			reply({ type: customElements.get('kicanvas-embed') ? 'ready' : 'failed' });
		</script>
	</body>
</html>
