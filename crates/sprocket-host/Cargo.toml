[package]
name = "sprocket-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
test-support = []

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
convex.workspace = true
fff-search = "0.11.0"
flate2 = "1.1.10"
fs4.workspace = true
futures.workspace = true
git2 = { version = "0.21.0", default-features = false }
hex.workspace = true
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
keyring.workspace = true
portable-pty = "0.9.0"
reqwest = { workspace = true, features = ["form", "rustls", "stream"] }
serde.workspace = true
serde_json.workspace = true
sevenz-rust2 = { version = "0.24.2", default-features = false, features = ["util"] }
sha2.workspace = true
sprocket-agent.workspace = true
sprocket-convex.workspace = true
sprocket-kicad.workspace = true
sprocket-transcript.workspace = true
sprocket-workspace.workspace = true
tar = "0.4"
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["io"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true
workos.workspace = true
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
dwarfs = { version = "0.2.1", default-features = false, features = ["zstd"] }

[target.'cfg(windows)'.dependencies]
memmap2 = "0.9.12"
nsis = "=0.6.0"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[dev-dependencies]
axum.workspace = true
gix.workspace = true
sevenz-rust2 = { version = "0.24.2", default-features = false, features = ["compress", "util"] }
tokio = { workspace = true, features = ["test-util"] }
