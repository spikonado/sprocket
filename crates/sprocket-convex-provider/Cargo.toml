[package]
name = "sprocket-convex-provider"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.102"
convex = { version = "0.10.4", default-features = false, features = ["rustls-tls-native-roots"] }
futures = "0.3.32"
rig = { package = "rig-core", version = "0.40.0", default-features = false }
rustls = { version = "0.23.40", features = ["ring"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["sync", "time"] }
