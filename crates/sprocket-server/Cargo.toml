[package]
name = "sprocket-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sprocket-server"
path = "src/bin/sprocket-server.rs"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.8", features = ["macros"] }
axum-extra = { version = "0.12.0", features = ["cookie"] }
base64 = "0.22.1"
clap = { version = "4.5.60", features = ["derive", "env"] }
cookie = { version = "0.18.1", features = ["percent-encode"] }
hmac = "0.13.0"
keyring = "4.2.0"
open = "5.4.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
sprocket-agent = { path = "../sprocket-agent" }
sprocket-convex = { path = "../sprocket-convex" }
sprocket-workspace = { path = "../sprocket-workspace" }
tokio = { version = "1.52.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tempfile = "3.27.0"
tower = "0.5.3"
convex = { version = "0.10.4", default-features = false, features = ["rustls-tls-native-roots"] }
futures = "0.3.32"
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.21.0", features = ["v4"] }
workos = "3.4.0"

[build-dependencies]
dotenvy = "0.15.7"

[dev-dependencies]
gix = { version = "0.87", default-features = false, features = ["sha1", "max-performance-safe"] }
