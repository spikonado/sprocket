[package]
name = "sprocket-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["macros", "ws"] }
axum-extra = { version = "0.12.0", features = ["cookie"] }
clap = { workspace = true, features = ["env"] }
convex.workspace = true
cookie = { version = "0.18.1", features = ["percent-encode"] }
futures.workspace = true
hmac.workspace = true
keyring.workspace = true
open.workspace = true
reqwest = { workspace = true, features = ["form", "rustls", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sprocket-agent.workspace = true
sprocket-convex.workspace = true
sprocket-host.workspace = true
sprocket-transcript.workspace = true
sprocket-workspace.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite.workspace = true
tokio-util = { workspace = true, features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = [
    "compression-gzip",
    "compression-zstd",
    "fs",
    "trace",
] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[build-dependencies]
dotenvy = "0.15.7"
serde_json.workspace = true

[dev-dependencies]
sprocket-host = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
workos.workspace = true
