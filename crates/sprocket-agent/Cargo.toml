[package]
name = "sprocket-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
anydoc = "0.2.4"
axum.workspace = true
base64.workspace = true
bytes = "1"
convex.workspace = true
fancy-regex = "0.20.0"
futures.workspace = true
hex.workspace = true
hmac.workspace = true
http = "1"
image = { version = "0.25.8", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
lopdf = "0.46.0"
pdf-inspector = "1.25.2"
percent-encoding = "2.3.2"
posthog-rs.workspace = true
pulldown-cmark = { version = "0.13.6", default-features = false }
reqwest = { workspace = true, features = ["gzip", "json", "rustls", "stream"] }
rig = { version = "0.46.0", default-features = false, features = ["agent", "reqwest", "rustls"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
sprocket-convex.workspace = true
sprocket-transcript.workspace = true
sprocket-workspace.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "time", "fs", "io-util", "net", "process", "rt"] }
tokio-tungstenite.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v7"] }
zstd = { version = "0.13.4", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "rt", "test-util"] }
