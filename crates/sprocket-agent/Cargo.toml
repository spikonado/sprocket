[package]
name = "sprocket-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.102"
anydoc = "0.2.4"
base64 = "0.22.1"
convex = { version = "0.10.4", default-features = false, features = ["rustls-tls-native-roots"] }
futures = "0.3.32"
image = { version = "0.25.8", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rig = { version = "0.42.0", default-features = false, features = ["agent", "reqwest", "rustls"] }
schemars = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sprocket-convex = { path = "../sprocket-convex" }
sprocket-workspace = { path = "../sprocket-workspace" }
thiserror = "2.0.18"
tempfile = "3.27.0"
tokio = { version = "1.52.1", features = ["macros", "sync", "time", "fs", "io-util", "rt"] }
uuid = { version = "1.21.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.52.1", features = ["rt", "test-util"] }
