[package]
name = "sprocket-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.102"
fs4 = { version = "1.1.0", default-features = false }
gix = { version = "0.90", default-features = false, features = ["sha1", "max-performance-safe"] }
hex = "0.4.3"
libc = "0.2.186"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tokio-util = "0.7.18"
uuid = { version = "1.21.0", features = ["v4"] }

[dev-dependencies]
gix = { version = "0.90", default-features = false, features = ["worktree-mutation"] }
tokio = { version = "1.52.1", features = ["test-util"] }
