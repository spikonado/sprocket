[package]
name = "sprocket-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.102"
cap-std = "4.0.2"
diffy = { version = "0.5.0", features = ["std"] }
gix = { version = "0.86", default-features = false, features = ["sha1", "max-performance-safe"] }
libc = "0.2.186"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tokio-util = "0.7.18"
