[package]
name = "sprocket-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
fs4.workspace = true
gix.workspace = true
hex.workspace = true
libc.workspace = true
reqwest = { workspace = true, features = ["rustls"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10.0"
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
tracing.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
gix = { workspace = true, features = ["worktree-mutation"] }
tokio = { workspace = true, features = ["test-util"] }
