fragment ThreadComment on PullRequestReviewComment {
	id
	author {
		login
	}
	body
	createdAt
	lastEditedAt
	url
}

# Whether anything a poll reports could have changed, for a point or so instead of a full read.
query PullRequestFingerprint($owner: String!, $name: String!, $number: Int!) {
	repository(owner: $owner, name: $name) {
		pullRequest(number: $number) {
			state
			mergeable
			headRefOid
			comments(first: 100, orderBy: { field: UPDATED_AT, direction: DESC }) {
				totalCount
				nodes {
					lastEditedAt
				}
			}
			reviews(last: 100) {
				totalCount
				nodes {
					lastEditedAt
				}
			}
			reviewThreads {
				totalCount
			}
			commits(last: 1) {
				nodes {
					commit {
						statusCheckRollup {
							contexts {
								checkRunCountsByState {
									state
									count
								}
								statusContextCountsByState {
									state
									count
								}
							}
						}
					}
				}
			}
		}
	}
}

query PullRequestStatus($owner: String!, $name: String!, $number: Int!, $after: String) {
	viewer {
		login
	}
	repository(owner: $owner, name: $name) {
		pullRequest(number: $number) {
			state
			mergeable
			headRefOid
			commits(last: 1) {
				nodes {
					commit {
						statusCheckRollup {
							contexts(first: 100, after: $after) {
								nodes {
									__typename
									... on StatusContext {
										context
										state
										targetUrl
										isRequired(pullRequestNumber: $number)
									}
									... on CheckRun {
										name
										status
										conclusion
										detailsUrl
										isRequired(pullRequestNumber: $number)
									}
								}
								pageInfo {
									hasNextPage
									endCursor
								}
							}
						}
					}
				}
			}
		}
	}
}

query PullRequestActivity(
	$owner: String!
	$name: String!
	$number: Int!
	$withComments: Boolean!
	$commentsAfter: String
	$withReviews: Boolean!
	$reviewsAfter: String
) {
	repository(owner: $owner, name: $name) {
		pullRequest(number: $number) {
			comments(first: 100, after: $commentsAfter) @include(if: $withComments) {
				pageInfo {
					hasNextPage
					endCursor
				}
				nodes {
					id
					body
					createdAt
					lastEditedAt
					url
					author {
						login
					}
				}
			}
			reviews(first: 100, after: $reviewsAfter) @include(if: $withReviews) {
				pageInfo {
					hasNextPage
					endCursor
				}
				nodes {
					id
					body
					state
					submittedAt
					lastEditedAt
					url
					author {
						login
					}
				}
			}
		}
	}
}

query ReviewThreads($owner: String!, $name: String!, $number: Int!, $after: String) {
	repository(owner: $owner, name: $name) {
		pullRequest(number: $number) {
			reviewThreads(first: 100, after: $after) {
				pageInfo {
					hasNextPage
					endCursor
				}
				nodes {
					id
					path
					# A hundred threads times a hundred comments costs GitHub 104 points, so longer
					# threads are paged by `ReviewThreadComments`.
					comments(first: 10) {
						pageInfo {
							hasNextPage
							endCursor
						}
						nodes {
							...ThreadComment
						}
					}
				}
			}
		}
	}
}

# GraphQL pages a nested connection only from its own node.
query ReviewThreadComments($threadId: ID!, $after: String) {
	node(id: $threadId) {
		... on PullRequestReviewThread {
			comments(first: 100, after: $after) {
				pageInfo {
					hasNextPage
					endCursor
				}
				nodes {
					...ThreadComment
				}
			}
		}
	}
}
